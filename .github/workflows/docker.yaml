name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one build per latest push
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: public-repo hygiene guard
        run: |
          # standing rule: no private domains in tracked files
          ! grep -riE "akiha\.nl" --include="*.py" --include="*.ts" --include="*.svelte" \
            --include="*.md" --include="*.yaml" --include="*.yml" . || {
            echo "::error::private domain found in tracked files"; exit 1; }

      - name: server — uv pytest + ruff
        run: |
          pipx install uv
          cd server
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q

      - name: frontend — vitest + tsc + build
        run: |
          cd frontend
          npm ci
          npx vitest run
          npx tsc --noEmit
          npm run build

  build-and-push:
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sebasdoes/shoplist-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
